<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22211F"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="waTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B76345"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#waBg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#363430" stroke-width="12"/>

  <!-- Unified WA Polylines (Stroke-based with round caps/joins for maximum sharpness) -->
  <path d="M 80 160
           L 142 355
           L 208 215
           L 274 355
           L 372 160
           L 438 355"
        fill="none"
        stroke="#F7F4EE"
        stroke-width="46"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Tech Accent Terminal Dot -->
  <circle cx="438" cy="160" r="18" fill="url(#waTerracotta)"/>
</svg>